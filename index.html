	<script>
		var Time = 0;
		var DBGlow = 0;
		var DBCount = 0;
		function DBInc() {
			DBGlow = 0.6;
			if (++DBCount < 3)
				return;
			location.href = "dashboard/redir.html";
		}
		function DBDec(d) {
			d -= Time; Time += d;
			DBGlow = Math.max(0, DBGlow - d / 1000);
			if (DBGlow == 0) DBCount = 0;
			requestAnimationFrame(DBDec);
		}
		requestAnimationFrame(DBDec);
	</script>
